name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "30.0.16248370"
  CMAKE_VERSION: "3.31.6"

jobs:
  models:
    name: Catalogue de modèles (Hugging Face)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier URLs, tailles et SHA-256
        run: python3 scripts/check_models.py --out models.resolved.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: models-resolved
          path: models.resolved.json

  llm:
    name: Nettoyage IA — décodage spéculatif (PC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Sous-module llama.cpp
        run: git submodule update --init third_party/llama.cpp
      - uses: actions/cache@v4
        with:
          path: ~/models
          key: qwen2.5-1.5b-instruct-q4_0-91cad511
      - name: Modèle Qwen 2.5 1.5B Q4_0 (celui de l'app)
        run: |
          mkdir -p ~/models
          f=~/models/qwen.gguf
          [ -f "$f" ] || curl -fsSL -o "$f" "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_0.gguf"
          echo "dcd819ff094852c38faba6873d8ff0c9d51eadb2844539e52042ae5d647bbfdb  $f" | sha256sum -c
      - name: Même texte qu'en glouton, et gain de vitesse
        run: |
          set -o pipefail
          scripts/llm_check/run.sh ~/models/qwen.gguf | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: APK arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # publication de la release « dev-latest »
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: SDK, NDK et CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-${{ hashFiles('.gitmodules', 'app/src/main/cpp/CMakeLists.txt', 'llm/src/main/cpp/CMakeLists.txt', 'llmgpu/src/main/cpp/CMakeLists.txt') }}
          max-size: 2G

      - name: Keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SPEECH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore de release utilisé"
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signé avec la clé de dev (app/dev.keystore)"
          fi

      - name: Tests unitaires + APK release
        env:
          SPEECH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPEECH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPEECH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/speech-${GITHUB_SHA::8}.apk"
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: speech-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error

      # APK téléchargeable directement depuis le téléphone (pas de zip, pas de vue PC) :
      # https://github.com/<owner>/<repo>/releases/download/dev-latest/speech.apk
      - name: Publier la release dev-latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=dev-latest
          cp out/*.apk out/speech.apk
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"
          NOTES="Build ${GITHUB_SHA::8} (${GITHUB_REF_NAME}) — $(git log -1 --format=%s)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Speech (dev) ${GITHUB_SHA::8}" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "Speech (dev) ${GITHUB_SHA::8}" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" out/speech.apk --clobber
          # Manifeste lu par la mise à jour in-app, publié après l'APK pour ne jamais pointer vers un APK absent.
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          sha = hashlib.sha256(open("out/speech.apk", "rb").read()).hexdigest()
          run = int(os.environ["GITHUB_RUN_NUMBER"])
          json.dump({
              "versionCode": run,
              "versionName": open("VERSION").read().strip(),
              "commit": os.environ["GITHUB_SHA"][:8],
              "notes": subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip(),
              "apkSha256": sha,
              "apkSize": os.path.getsize("out/speech.apk"),
          }, open("out/version.json", "w"), ensure_ascii=False, indent=2)
          PY
          gh release upload "$TAG" out/version.json --clobber

      # Release stable vX.Y.Z (fichier VERSION) créée une seule fois, sur le commit compilé.
      - name: Publier la release stable
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG déjà publiée"
            exit 0
          fi
          cp out/speech.apk "out/speech-$VERSION.apk"
          NOTES="docs/release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          gh release create "$TAG" "out/speech-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "Speech $VERSION" --latest "${NOTES_ARG[@]}"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/
